<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamado de TI - Suporte N1</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 550px;
        }
        h2 {
            color: #1a252f;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        label.form-label {
            font-weight: 600;
            display: block;
            margin-top: 15px;
            color: #2c3e50;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        
        /* Estilo dos Problemas Rápidos (N1) */
        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }
        .checkbox-item input {
            margin-right: 8px;
            cursor: pointer;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background-color: #25d366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
        }
        button:hover {
            background-color: #1eb954;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Abertura de Chamado - TI (N1)</h2>
    <form id="formChamado">
        
        <label class="form-label" for="nome">Nome Completo:</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>

        <!-- Campo com Digitação + Seleção de Lista de Setores -->
        <label class="form-label" for="setor">Setor / Departamento:</label>
        <input list="lista-setores" id="setor" name="setor" placeholder="Clique para escolher ou comece a digitar..." required autocomplete="off">
        
        <datalist id="lista-setores">
            <option value="SUPERVISÃO ADM">
            <option value="RH">
            <option value="Direção Geral">
            <option value="Direção Clínica">
            <option value="Direção ADM">
            <option value="Coordenação Multidisciplinar">
            <option value="Coordenação ADM">
            <option value="Coordenação de Enfermagem">
            <option value="Coordenação Ambulatório">
            <option value="NIR (Núcleo Interno de Regulação)">
            <option value="Núcleos">
            <option value="Farmácia">
            <option value="Farmácia Ambulatório">
            <option value="Faturamento">
            <option value="Marcação de Consultas">
            <option value="Entrega de Exames">
            <option value="Dermato">
            <option value="UTI 1">
            <option value="UTI 2">
            <option value="Posto A">
            <option value="Posto B">
            <option value="Posto C">
            <option value="Almoxarifado Dermato">
            <option value="Almoxarifado Internação">
            <option value="Recepção Internação">
            <option value="CPD">
            <option value="EPMED">
            <option value="Imunização">
            <option value="NEP">
            <option value="SAME">
            <option value="Serviço Social Dermato">
            <option value="Serviço Social Internação">
        </datalist>

        <label class="form-label">Selecione o(s) problema(s):</label>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Impressora (Papel preso / Não imprime)"> Impressora</label>
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Sem acesso à Internet / Rede"> Sem Internet/Rede</label>
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Troca de Toner / Cartucho"> Troca de Toner</label>
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Computador não liga"> Computador não liga</label>
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Sistema / Programa travando"> Programa travando</label>
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Reset de Senha / Login bloqueado"> Reset de Senha</label>
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Teclado / Mouse com defeito"> Teclado / Mouse</label>
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Lentidão geral no PC"> Lentidão no PC</label>
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Monitor sem imagem / Apagado"> Monitor sem imagem</label>
            <label class="checkbox-item"><input type="checkbox" name="problemas" value="Outro problema"> Outro / Não listado</label>
        </div>

        <label class="form-label" for="prioridade">Urgência:</label>
        <select id="prioridade" required>
            <option value="Baixa">Baixa (Pode aguardar)</option>
            <option value="Média" selected>Média (Atrapalha a rotina)</option>
            <option value="Alta">Alta (Setor / Trabalho parado)</option>
        </select>

        <label class="form-label" for="descricao">Observações / Detalhes adicionais:</label>
        <textarea id="descricao" placeholder="Descreva mais detalhes se necessário (ex: número da impressora, mensagem de erro...)"></textarea>

        <button type="button" onclick="enviarParaWhatsApp()">Enviar Chamado pelo WhatsApp</button>
    </form>
</div>

<script>
    function enviarParaWhatsApp() {
        // Seu número cadastrado[cite: 1]
        const numeroTI = "5598992141185"; 

        const nome = document.getElementById("nome").value;
        const setor = document.getElementById("setor").value;
        const prioridade = document.getElementById("prioridade").value;
        const descricao = document.getElementById("descricao").value || "Nenhuma observação informada.";

        // Coleta todos os checkboxes marcados[cite: 1]
        const checkboxes = document.querySelectorAll('input[name="problemas"]:checked');
        let problemasSelecionados = [];
        
        checkboxes.forEach((cb) => {
            problemasSelecionados.push(cb.value);
        });

        // Validações básicas[cite: 1]
        if (!nome.trim() || !setor.trim()) {
            alert("Por favor, preencha seu nome e selecione/digite seu setor.");
            return;
        }

        if (problemasSelecionados.length === 0) {
            alert("Por favor, selecione pelo menos um problema da lista.");
            return;
        }

        const listaProblemasTexto = problemasSelecionados.map(p => `• ${p}`).join('\n');

        // Monta o texto formatado para o WhatsApp[cite: 1]
        const texto = `*NOVO CHAMADO DE TI (N1)*\n\n` +
                      `*Solicitante:* ${nome}\n` +
                      `*Setor/Local:* ${setor}\n` +
                      `*Urgência:* ${prioridade}\n\n` +
                      `*Problema(s) Relatado(s):*\n${listaProblemasTexto}\n\n` +
                      `*Detalhes:* ${descricao}`;

        // Link da API do WhatsApp com encode correto[cite: 1]
        const urlWhatsApp = `https://wa.me/${numeroTI}?text=${encodeURIComponent(texto)}`;

        // Abre no WhatsApp[cite: 1]
        window.open(urlWhatsApp, "_blank");
    }
</script>

</body>
</html>
