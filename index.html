<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamado de TI · N1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --ink:#0f1b24;
    --ink-soft:#4a5c68;
    --line:#d8e1e6;
    --paper:#eef3f5;
    --card:#ffffff;
    --teal:#0d6e6e;
    --teal-deep:#08494d;
    --low:#2f8f5b;
    --med:#c07a12;
    --high:#c23b3b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 100% -10%, #dcebe9 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .shell{
    width:100%;
    max-width:600px;
  }

  /* Header */
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    padding:0 4px;
  }
  .brand .mark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mark-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 4px rgba(13,110,110,.15);
  }
  .brand h1{
    font-size:15px;
    font-weight:700;
    letter-spacing:.01em;
    margin:0;
    color:var(--teal-deep);
  }
  .brand .sla{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  /* Hero strip */
  .hero{
    background:linear-gradient(135deg,var(--teal-deep),var(--teal) 70%);
    border-radius:var(--radius);
    padding:26px 26px 24px;
    color:#eefbf8;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:180px; height:180px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%);
  }
  .hero h2{
    font-size:22px;
    line-height:1.25;
    font-weight:800;
    margin:0 0 6px;
    max-width:32ch;
    letter-spacing:-0.01em;
  }
  .hero p{
    margin:0;
    font-size:13.5px;
    color:#cdeae4;
    max-width:40ch;
  }
  .hero .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    padding:5px 10px;
    border-radius:100px;
  }

  /* Card */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    padding:26px 24px 24px;
  }

  .field{ margin-bottom:20px; }
  .field:last-of-type{ margin-bottom:0; }

  label.form-label{
    display:block;
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    margin-bottom:7px;
  }
  label.form-label .hint{
    font-weight:500;
    color:var(--ink-soft);
    font-size:12px;
  }

  input[type="text"], select, textarea{
    width:100%;
    padding:12px 13px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
    background:#fbfcfc;
    transition:border-color .15s ease, background .15s ease;
  }
  input[type="text"]:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--teal);
    background:#fff;
  }
  textarea{ resize:vertical; min-height:76px; }

  /* Problem grid — as tappable chips, not plain checkbox rows */
  .checkbox-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .checkbox-item{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
    color:var(--ink);
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    background:#fbfcfc;
    transition:border-color .15s ease, background .15s ease;
    user-select:none;
  }
  .checkbox-item:has(input:checked){
    border-color:var(--teal);
    background:#eaf5f3;
  }
  .checkbox-item input{
    accent-color:var(--teal);
    width:15px;height:15px;
    flex-shrink:0;
    cursor:pointer;
  }
  @media (max-width:420px){
    .checkbox-group{ grid-template-columns:1fr; }
  }

  /* Urgency — segmented control instead of a plain <select> feel */
  .urgency-group{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
  }
  .urgency-item{
    position:relative;
  }
  .urgency-item input{
    position:absolute;
    opacity:0;
    inset:0;
    cursor:pointer;
  }
  .urgency-item label{
    display:block;
    text-align:center;
    padding:10px 4px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    background:#fbfcfc;
    transition:all .15s ease;
  }
  .urgency-item input:checked + label{ color:#fff; border-color:transparent; }
  .urgency-item.low input:checked + label{ background:var(--low); }
  .urgency-item.med input:checked + label{ background:var(--med); }
  .urgency-item.high input:checked + label{ background:var(--high); }
  .urgency-item label small{
    display:block;
    font-weight:500;
    font-size:10.5px;
    margin-top:2px;
    opacity:.85;
  }

  button{
    margin-top:24px;
    width:100%;
    padding:15px;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:15.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--teal-deep); }
  button:active{ transform:scale(.99); }
  button svg{ width:18px; height:18px; }

  .footnote{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:14px;
  }
</style>
</head>
<body>

<div class="shell">

  <div class="brand">
    <div class="mark">
      <span class="mark-dot"></span>
      <h1>Suporte de TI</h1>
    </div>
    <span class="sla">N1 · resposta em minutos</span>
  </div>


  <div class="card">
    <form id="formChamado">

      <div class="field">
        <label class="form-label" for="nome">Seu nome completo</label>
        <input type="text" id="nome" placeholder="Ex: Maria Souza" required>
      </div>

      <div class="field">
        <label class="form-label" for="setor">Setor / Departamento</label>
        <input list="lista-setores" id="setor" name="setor" placeholder="Digite ou selecione seu setor" required autocomplete="off">
        <datalist id="lista-setores">
          <option value="SUPERVISÃO ADM">
          <option value="RH">
          <option value="Direção Geral">
          <option value="Direção Clínica">
          <option value="Direção ADM">
          <option value="Coordenação Multidisciplinar">
          <option value="Coordenação ADM">
          <option value="Coordenação de Enfermagem">
          <option value="Coordenação Ambulatório">
          <option value="NIR (Núcleo Interno de Regulação)">
          <option value="Núcleos">
          <option value="Farmácia">
          <option value="Farmácia Ambulatório">
          <option value="Faturamento">
          <option value="Marcação de Consultas">
          <option value="Entrega de Exames">
          <option value="Dermato">
          <option value="UTI 1">
          <option value="UTI 2">
          <option value="Posto A">
          <option value="Posto B">
          <option value="Posto C">
          <option value="Almoxarifado Dermato">
          <option value="Almoxarifado Internação">
          <option value="Recepção Internação">
          <option value="CPD">
          <option value="EPMED">
          <option value="Imunização">
          <option value="NEP">
          <option value="SAME">
          <option value="Serviço Social Dermato">
          <option value="Serviço Social Internação">
        </datalist>
      </div>

      <div class="field">
        <label class="form-label">O que está acontecendo? <span class="hint">— selecione um ou mais</span></label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Impressora (Papel preso / Não imprime)">Impressora</label>
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Sem acesso à Internet / Rede">Sem internet/rede</label>
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Troca de Toner / Cartucho">Troca de toner</label>
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Computador não liga">Computador não liga</label>
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Sistema / Programa travando">Programa travando</label>
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Reset de Senha / Login bloqueado">Reset de senha</label>
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Teclado / Mouse com defeito">Teclado / mouse</label>
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Lentidão geral no PC">Lentidão no PC</label>
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Monitor sem imagem / Apagado">Monitor sem imagem</label>
          <label class="checkbox-item"><input type="checkbox" name="problemas" value="Outro problema">Outro / não listado</label>
        </div>
      </div>

      <div class="field">
        <label class="form-label">Qual a urgência?</label>
        <div class="urgency-group">
          <div class="urgency-item low">
            <input type="radio" name="prioridade" id="p-baixa" value="Baixa">
            <label for="p-baixa">Baixa<small>pode esperar</small></label>
          </div>
          <div class="urgency-item med">
            <input type="radio" name="prioridade" id="p-media" value="Média" checked>
            <label for="p-media">Média<small>atrapalha</small></label>
          </div>
          <div class="urgency-item high">
            <input type="radio" name="prioridade" id="p-alta" value="Alta">
            <label for="p-alta">Alta<small>setor parado</small></label>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="form-label" for="descricao">Mais detalhes <span class="hint">— opcional</span></label>
        <textarea id="descricao" placeholder="Número da impressora, mensagem de erro, horário que começou..."></textarea>
      </div>

      <button type="button" onclick="enviarParaWhatsApp()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.28-1.39c1.44.79 3.06 1.2 4.72 1.2h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0012.04 2z" opacity=".001"/><path d="M17.47 14.38c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.48-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51-.17-.01-.37-.01-.57-.01-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.87 1.22 3.07.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.29.17-1.42-.07-.12-.27-.2-.57-.35z"/></svg>
        Enviar chamado pelo WhatsApp
      </button>
    </form>
  </div>

  <p class="footnote">Seus dados vão apenas para a equipe de TI interna.</p>
</div>

<script>
function enviarParaWhatsApp() {
    const numeroTI = "5598992141185";

    const nome = document.getElementById("nome").value;
    const setor = document.getElementById("setor").value;
    const prioridadeEl = document.querySelector('input[name="prioridade"]:checked');
    const prioridade = prioridadeEl ? prioridadeEl.value : "Média";
    const descricao = document.getElementById("descricao").value || "Nenhuma observação informada.";

    const checkboxes = document.querySelectorAll('input[name="problemas"]:checked');
    let problemasSelecionados = [];
    checkboxes.forEach((cb) => problemasSelecionados.push(cb.value));

    if (!nome.trim() || !setor.trim()) {
        alert("Por favor, preencha seu nome e selecione/digite seu setor.");
        return;
    }
    if (problemasSelecionados.length === 0) {
        alert("Por favor, selecione pelo menos um problema da lista.");
        return;
    }

    const listaProblemasTexto = problemasSelecionados.map(p => `• ${p}`).join('\n');

    const texto = `*NOVO CHAMADO DE TI (N1)*\n\n` +
                  `*Solicitante:* ${nome}\n` +
                  `*Setor/Local:* ${setor}\n` +
                  `*Urgência:* ${prioridade}\n\n` +
                  `*Problema(s) Relatado(s):*\n${listaProblemasTexto}\n\n` +
                  `*Detalhes:* ${descricao}`;

    const urlWhatsApp = `https://wa.me/${numeroTI}?text=${encodeURIComponent(texto)}`;
    window.open(urlWhatsApp, "_blank");
}
</script>

</body>
</html>
